name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build clanking
        run: CGO_ENABLED=0 go build -buildvcs=false -o bin/clanking ./cmd/clanking

      - uses: actions/upload-artifact@v4
        with:
          name: clanking-linux-amd64
          path: bin/clanking
